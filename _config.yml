title: B.Tech Theory — Course Site
description: Tutorials, assignments, materials and results for the B.Tech Theory course, IIT Kharagpur.
theme: just-the-docs

# ---- Search (built in to Just the Docs) ----
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ---- Math rendering (GPE, Hamiltonians, etc.) ----
mathjax: true
kramdown:
  math_engine: mathjax

# ---- Nav / footer ----
nav_order_default: 100
aux_links:
  "Course repo on GitHub":
    - "https://github.com/YOUR-USERNAME/btech-theory-2026"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 B.Tech Theory. Maintained by Asish Panda (TA)."

# ---- Color scheme: "dark" or "light" ----
color_scheme: dark

# ---- Callouts (used for notices in Markdown pages) ----
callouts_level: quiet
callouts:
  important:
    title: Important
    color: red
  note:
    title: Note
    color: blue
  submission:
    title: Submission
    color: green

# ---- Plugins GitHub Pages supports out of the box ----
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ---- Exclude non-site files from the build ----
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
